<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Maaltijden 4.0 – overige pagina's</title>
<link rel="stylesheet" href="/public/css/buddy.css">
<style>
@font-face { font-family: 'Nunito'; font-weight: 400 900; src: url(/public/fonts/nunito-latin.woff2) format('woff2'); }
@font-face { font-family: 'Fredoka'; font-weight: 500 700; src: url(/public/fonts/fredoka-latin.woff2) format('woff2'); }
:root { --bg:#fff7ef; --surface:#fff; --s2:#fff0e4; --ink:#3a2a22; --muted:#8f7768; --line:#f1e1d2; --primary:#e5683c; --soft:#ffe9dc; --ptext:#b4502b;
  --peach2:#ffd3b8; --peach3:#ffe3cf; --green:#6bbf80; --yellow:#f4b73a; --head:'Fredoka','Nunito',sans-serif; --shadow:0 2px 4px rgba(120,70,30,.04),0 8px 24px rgba(120,70,30,.07); }
* { box-sizing: border-box; margin: 0; }
html, body { background: #e9ebee; }
body { font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); padding: 44px 52px; font-weight: 600; }
.title { display:flex; align-items:baseline; gap:18px; margin-bottom: 26px; color:#2a2f36 }
.title h1 { font: 900 40px 'Nunito'; }
.title p { font-size: 21px; color:#6b7280; font-weight: 600 }
.boards { display:flex; gap: 44px; align-items:flex-start }
.label { font: 700 18px 'Nunito'; color:#6b7280; margin: 0 0 12px 6px; }
h2, h3, .h { font-family: var(--head); font-weight: 600; letter-spacing: -.01em; }

/* Telefoon */
.phone { width: 390px; height: 844px; border-radius: 52px; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 0 10px #1c1f24, 0 30px 60px rgba(0,0,0,.25); }
.status { height: 46px; display:flex; justify-content:space-between; align-items:center; padding: 6px 30px 0; font: 700 15px system-ui; position: relative; }
.status::after { content:''; position:absolute; left:50%; top:10px; width:110px; height:30px; background:#1c1f24; border-radius:20px; transform:translateX(-50%) }
.top { display:flex; align-items:center; gap: 10px; padding: 6px 18px 10px; }
.top .buddy { width: 34px; margin: 0 }
.top b { font: 600 19px var(--head); }
.top .av { margin-left:auto; width:34px; height:34px; border-radius:50%; background: var(--primary); color:#fff; display:grid; place-items:center; font-weight:800 }
.scroll { height: calc(844px - 46px - 50px - 84px); overflow: hidden; padding: 0 18px; }
.tabbar { position:absolute; left:0; right:0; bottom:0; height:84px; background: var(--surface); display:grid; grid-template-columns: repeat(5,1fr); padding-top: 8px; box-shadow: 0 -6px 20px rgba(120,70,30,.08) }
.tab { text-align:center; font-size: 11px; font-weight: 800; color: var(--muted) }
.tab .i { font-size: 21px; display:block; filter: grayscale(1); opacity:.55 }
.tab.on { color: var(--ptext) } .tab.on .i { filter:none; opacity:1 }
.plus { width: 58px; height: 58px; border-radius: 50%; background: var(--primary); color:#fff; display:grid; place-items:center; font-size: 32px; margin: -26px auto 2px; border: 4px solid var(--bg); box-shadow: 0 10px 22px rgba(229,104,60,.4) }

/* Gedeeld */
.card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px }
.chip { display:inline-flex; align-items:center; gap:5px; border-radius: 99px; padding: 6px 12px; font-weight: 800; font-size: 13px; background: var(--surface); white-space: nowrap }
.chip.on { background: var(--primary); color:#fff }
.chips { display:flex; gap: 6px; flex-wrap: nowrap; overflow: hidden; margin: 10px 0 }
.muted { color: var(--muted) }
.small { font-size: 12.5px }
.ph { object-fit: cover; display:block; background: var(--s2) }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius: 99px; padding: 10px 16px; font-weight: 800; font-size: 14px; background: var(--surface); box-shadow: var(--shadow) }
.btn.p { background: var(--primary); color:#fff; box-shadow: 0 8px 18px rgba(229,104,60,.3) }
.bubble { background: var(--soft); border-radius: 18px 18px 18px 6px; padding: 9px 12px; font-size: 13px; font-weight: 700; line-height: 1.35 }
.pagetitle { font: 600 27px var(--head); margin: 2px 2px 2px }
.sub { color: var(--muted); font-size: 13.5px; margin: 0 2px 10px }
.row { display:flex; align-items:center; gap: 11px }
.grow { flex: 1; min-width: 0 }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.k { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
.n { font-weight: 800; font-size: 15px }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid var(--line); flex: none; display:grid; place-items:center; color:#fff; font-size: 13px }
.check.on { background: var(--green); border-color: var(--green) }
.done .n { text-decoration: line-through; color: var(--muted) }
.search { background: var(--surface); border-radius: 99px; padding: 11px 16px; color: var(--muted); font-weight: 700; box-shadow: var(--shadow); display:flex; gap:8px }

/* Computer */
.desk { width: 1440px; height: 844px; border-radius: 18px; background: var(--bg); overflow:hidden; box-shadow: 0 30px 60px rgba(0,0,0,.2) }
.chrome { height: 38px; background:#e4e6ea; display:flex; align-items:center; gap:8px; padding: 0 16px }
.chrome i { width:12px; height:12px; border-radius:50%; background:#ff5f57 } .chrome i:nth-child(2){background:#febc2e} .chrome i:nth-child(3){background:#28c840}
.chrome span { margin-left: 20px; background:#fff; border-radius: 8px; padding: 4px 14px; font: 500 13px system-ui; color:#666; width: 420px }
.dtop { height: 66px; display:flex; align-items:center; gap: 6px; padding: 0 30px; background: var(--surface); box-shadow: 0 1px 0 var(--line) }
.dtop .brand { display:flex; align-items:center; gap: 9px; font: 600 20px var(--head); margin-right: 22px }
.dtop .brand .buddy { width: 38px; margin:0 }
.dnav { padding: 8px 13px; border-radius: 99px; font-weight: 800; color: var(--muted); font-size: 15px }
.dnav.on { background: var(--soft); color: var(--ptext) }
.dlog { margin-left: auto; background: var(--primary); color:#fff; border-radius: 99px; padding: 10px 18px; font-weight: 800 }
.dbody { padding: 24px 30px }
</style>
</head>
<body>
<div class="title"><h1 id="t"></h1><p id="st"></p></div>
<div class="boards" id="boards"></div>
<script type="module">
import { buddySvg } from '/public/js/buddy.js';
const q = new URLSearchParams(location.search);
const opt = q.get('opt') || 'a';
const view = q.get('view') || 'phone';
const R = (f) => `/public/img/recipes/${f}.jpg`;
const I = (f) => `/public/img/ingredients/${f}.jpg`;
const NAMES = {
  a: ['Richting A – Kaartjes', 'Zoals Vandaag: witte ronde kaarten op perzik, grote foto\'s, het maatje geeft af en toe een tip'],
  b: ['Richting B – Rustig lijstje', 'Nog minimalistischer: bijna geen kaders, veel witruimte, dunne lijnen, alles in één rustige kolom'],
  c: ['Richting C – Foto\'s & bubbels', 'Speels en beeldend: grote foto-tegels, één dag tegelijk, het maatje praat bovenaan elke pagina'],
};
t.textContent = NAMES[opt][0] + (view === 'desk' ? ' · computer' : '');
st.textContent = NAMES[opt][1];

const status = '<div class="status"><span>12:41</span><span>●●● 🔋</span></div>';
const top = `<div class="top">${buddySvg({ mood: 'rust' })}<b>Maaltijden</b><span class="av">D</span></div>`;
const tabbar = (on) => `<div class="tabbar">${[['🏠', 'Vandaag'], ['📅', 'Planner'], null, ['📖', 'Recepten'], ['☰', 'Meer']].map((x) => x
  ? `<div class="tab ${x[1] === on ? 'on' : ''}"><span class="i">${x[0]}</span>${x[1]}</div>` : '<div class="tab" style="color:var(--ptext)"><div class="plus">+</div>Loggen</div>').join('')}</div>`;
const phone = (label, on, body, { noTop = false } = {}) => `<div><div class="label">${label}</div><div class="phone">${status}${noTop ? '' : top}
  <div class="scroll" style="${noTop ? 'height:714px;padding:0' : ''}">${body}</div>${tabbar(on)}</div></div>`;

const days = [['ma', 20], ['di', 21], ['wo', 22], ['do', 23], ['vr', 24], ['za', 25], ['zo', 26]];
const week = [
  ['vr 24', 'Vandaag', [['diner', 'Butter chicken met pandanrijst', 'butter-chicken-met-pandanrijst', 717, '3,25']], ['ontbijt', 'lunch']],
  ['za 25', 'Morgen', [['lunch', 'Tosti ham-kaas', 'tosti-ham-kaas', 410, '1,10'], ['diner', 'Pasta pesto met kip', 'pasta-pesto-met-kip-en-spinazie', 640, '2,80']], ['ontbijt']],
  ['zo 26', 'Zondag', [['diner', 'Hollandse pannenkoeken', 'hollandse-pannenkoeken', 520, '0,95']], ['ontbijt', 'lunch']],
];
const shopping = [
  ['🥦 Groente & fruit', [['courgette', 'Courgette', '2 stuks', true], ['paprika', 'Paprika rood', '2 stuks', true], ['ui', 'Uien', '3 stuks', false], ['banaan', 'Bananen', '6 stuks', false]]],
  ['🍗 Vlees, vis & vega', [['kipfilet', 'Kipfilet', '600 g', false]]],
  ['🍚 Pasta, rijst & wereld', [['zilvervliesrijst', 'Zilvervliesrijst', '400 g', false], ['kokosmelk', 'Kokosmelk', '1 blik', false]]],
];
const recipes = [
  ['butter-chicken-met-pandanrijst', 'Butter chicken met pandanrijst', 30, 717, '3,25', true],
  ['griekse-salade-met-feta', 'Griekse salade met feta', 15, 393, '1,99'],
  ['shakshuka', 'Shakshuka', 25, 420, '1,45', true],
  ['pasta-met-zalm-en-spinazie', 'Pasta met zalm en spinazie', 25, 610, '3,10'],
  ['gado-gado', 'Gado-gado', 40, 602, '1,92'],
  ['pompoensoep', 'Pompoensoep', 35, 260, '1,05'],
];
const ings = [['kipfilet', 'Kipfilet', '500 g'], ['ui', 'Ui', '1 stuk'], ['paprika', 'Paprika', '1 stuk'], ['kokosmelk', 'Kokosmelk', '1 blik'], ['zilvervliesrijst', 'Zilvervliesrijst', '300 g'], ['sperziebonen', 'Sperziebonen', '400 g']];

// ================= A – Kaartjes =================
function A() {
  const planner = `<div class="row" style="justify-content:space-between"><div><div class="pagetitle">Week 43</div><div class="sub" style="margin:0 2px">20 – 26 oktober</div></div>
      <div class="row" style="gap:6px"><span class="btn" style="padding:9px 13px">‹</span><span class="btn" style="padding:9px 13px">›</span></div></div>
    <div class="row" style="gap:6px;margin:12px 0">${[['€ 75', 'deze week'], ['673', 'kcal/dag'], ['7', 'maaltijden']].map(([v, l]) => `<div class="card" style="flex:1;margin:0;padding:9px;text-align:center"><div class="h" style="font-size:19px">${v}</div><div class="small muted">${l}</div></div>`).join('')}</div>
    ${week.map(([d, lab, meals, empty]) => `<div class="card" style="padding:10px 14px"><div class="row" style="justify-content:space-between;margin-bottom:4px"><b class="h" style="font-size:16px">${lab}</b><span class="small muted">${d}</span></div>
      ${meals.map(([k, n, img, kc, eur]) => `<div class="row" style="padding:7px 0"><img class="ph" src="${R(img)}" style="width:46px;height:46px;border-radius:14px"><div class="grow"><div class="k">${k}</div><div class="n ell">${n}</div><div class="small muted">${kc} kcal · € ${eur} p.p.</div></div><span class="muted" style="font-size:20px">⋯</span></div>`).join('')}
      <div class="row" style="gap:6px;margin-top:4px">${empty.map((e) => `<span class="chip" style="background:var(--s2);color:var(--ptext)">+ ${e}</span>`).join('')}</div></div>`).join('')}`;
  const recepten = `<div class="pagetitle">Recepten</div><div class="sub">50 recepten · 8 favorieten</div>
    <div class="search">🔎 Zoek recept of ingrediënt…</div>
    <div class="chips"><span class="chip on">Alles</span><span class="chip">♥ Favorieten</span><span class="chip">⏱ &lt; 30 min</span><span class="chip">🥦 Vega</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${recipes.map(([img, n, min, kc, , fav]) => `<div class="card" style="padding:0;overflow:hidden;margin:0"><div style="position:relative"><img class="ph" src="${R(img)}" style="width:100%;height:112px">
      <span style="position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;color:${fav ? '#ff6b81' : '#d8c8bb'}">♥</span></div>
      <div style="padding:9px 11px 11px"><div class="n" style="font-size:14px;line-height:1.25;height:36px;overflow:hidden">${n}</div><div class="small muted" style="margin-top:3px">${min} min · ${kc} kcal</div></div></div>`).join('')}</div>`;
  const recept = `<img class="ph" src="${R('kip-kerrie-met-rijst')}" style="width:100%;height:230px;border-radius:0 0 30px 30px">
    <div style="padding:0 18px"><div class="pagetitle" style="margin-top:14px">Kip kerrie met rijst</div>
    <div class="chips" style="flex-wrap:wrap"><span class="chip">⏱ 35 min</span><span class="chip">🔥 677 kcal</span><span class="chip">€ 3,13 p.p.</span><span class="chip">🐾 super</span></div>
    <div class="card row" style="justify-content:space-between;padding:10px 14px"><b>Personen</b><div class="row" style="gap:12px"><span class="btn" style="padding:6px 13px">−</span><b class="h" style="font-size:20px">4</b><span class="btn" style="padding:6px 13px">+</span></div></div>
    <div class="row" style="gap:6px;background:var(--s2);border-radius:99px;padding:4px;margin-bottom:10px"><span class="chip on" style="flex:1;justify-content:center">Ingrediënten</span><span class="chip" style="flex:1;justify-content:center;background:none">Bereiding</span><span class="chip" style="flex:1;justify-content:center;background:none">Voeding</span></div>
    <div class="card" style="padding:4px 14px">${ings.slice(0, 5).map(([img, n, a]) => `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><img class="ph" src="${I(img)}" style="width:34px;height:34px;border-radius:10px"><span class="grow n" style="font-size:14px">${n}</span><b class="muted">${a}</b></div>`).join('')}</div></div>`;
  const reBar = `<div style="position:absolute;left:0;right:0;bottom:84px;padding:26px 14px 12px;background:linear-gradient(rgba(255,247,239,0),var(--bg) 40%)" class="row"><span class="btn" style="flex:1">👩‍🍳 Kookmodus</span><span class="btn p" style="flex:1.3">📅 Inplannen</span></div>`;
  const boodschappen = `<div class="pagetitle">Boodschappen</div><div class="sub">Week 43 · voor 9 maaltijden</div>
    <div class="card row"><svg width="58" height="58" viewBox="0 0 58 58" style="transform:rotate(-90deg)"><circle cx="29" cy="29" r="23" fill="none" stroke="#fff0e4" stroke-width="8"/><circle cx="29" cy="29" r="23" fill="none" stroke="#6bbf80" stroke-width="8" stroke-linecap="round" stroke-dasharray="40 145"/></svg>
      <div class="grow"><b class="h" style="font-size:18px">2 van 8 in je mandje</b><div class="small muted">nog ± € 22,40</div></div></div>
    ${shopping.map(([h, items]) => `<div class="k" style="margin:12px 4px 6px">${h}</div><div class="card" style="padding:4px 14px">${items.map(([img, n, a, d]) => `<div class="row ${d ? 'done' : ''}" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="check ${d ? 'on' : ''}">${d ? '✓' : ''}</span><img class="ph" src="${I(img)}" style="width:32px;height:32px;border-radius:10px;${d ? 'opacity:.5' : ''}"><span class="grow n" style="font-size:14px">${n}</span><span class="small muted">${a}</span></div>`).join('')}</div>`).join('')}`;
  return [phone('Planner', 'Planner', planner), phone('Recepten', 'Recepten', recepten), `<div><div class="label">Recept</div><div class="phone">${status}<div class="scroll" style="height:714px;padding:0">${recept}</div>${reBar}${tabbar('Recepten')}</div></div>`, phone('Boodschappen', 'Meer', boodschappen)];
}

// ================= B – Rustig lijstje =================
function B() {
  const line = 'border-bottom:1px solid var(--line)';
  const planner = `<div class="pagetitle" style="font-size:32px;margin-top:6px">Deze week</div><div class="sub">20 – 26 okt · € 75 · gem. 673 kcal</div>
    ${week.map(([d, lab, meals, empty]) => `<div style="margin-top:16px"><div class="k" style="color:${lab === 'Vandaag' ? 'var(--ptext)' : ''}">${lab} · ${d}</div>
      ${meals.map(([k, n, img, kc]) => `<div class="row" style="padding:11px 0;${line}"><img class="ph" src="${R(img)}" style="width:40px;height:40px;border-radius:50%"><div class="grow"><div class="n ell" style="font-size:15.5px">${n}</div><div class="small muted">${k} · ${kc} kcal</div></div></div>`).join('')}
      ${empty.map((e) => `<div class="row" style="padding:11px 0;${line};color:var(--muted)"><span style="width:40px;height:40px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center">+</span><span>${e}</span></div>`).join('')}</div>`).join('')}
    <div style="position:absolute;right:18px;bottom:100px" class="btn">✨ Vul de week aan</div>`;
  const recepten = `<div class="pagetitle" style="font-size:32px;margin-top:6px">Recepten</div>
    <div style="border-bottom:2px solid var(--line);padding:10px 2px;color:var(--muted);font-weight:700;margin-bottom:6px">🔎 Zoeken</div>
    <div class="row" style="gap:16px;margin:10px 2px 6px;font-weight:800;font-size:14px"><span style="color:var(--ptext);border-bottom:2px solid var(--primary);padding-bottom:4px">Alles</span><span class="muted">Favorieten</span><span class="muted">Snel</span><span class="muted">Vega</span></div>
    ${recipes.map(([img, n, min, kc, eur, fav]) => `<div class="row" style="padding:10px 0;${line}"><img class="ph" src="${R(img)}" style="width:62px;height:62px;border-radius:16px"><div class="grow"><div class="n" style="font-size:15.5px">${n}</div><div class="small muted">${min} min · ${kc} kcal · € ${eur}</div></div><span style="color:${fav ? '#ff6b81' : '#e3d3c6'};font-size:18px">♥</span></div>`).join('')}`;
  const recept = `<img class="ph" src="${R('kip-kerrie-met-rijst')}" style="width:100%;height:300px">
    <div style="background:var(--bg);border-radius:30px 30px 0 0;margin-top:-30px;position:relative;padding:22px 22px 0">
      <div class="pagetitle" style="font-size:28px">Kip kerrie met rijst</div>
      <div class="sub" style="margin-top:4px">35 min · 677 kcal · € 3,13 p.p. · 4 personen</div>
      <div class="k" style="margin:16px 0 4px">Ingrediënten</div>
      ${ings.map(([, n, a], i) => `<div class="row" style="padding:10px 0;${line}"><span class="check ${i < 2 ? 'on' : ''}">${i < 2 ? '✓' : ''}</span><span class="grow n" style="font-size:15px;${i < 2 ? 'color:var(--muted);text-decoration:line-through' : ''}">${n}</span><span class="muted">${a}</span></div>`).join('')}
    </div>`;
  const reBar = `<div style="position:absolute;left:0;right:0;bottom:84px;padding:26px 18px 12px;background:linear-gradient(rgba(255,247,239,0),var(--bg) 40%)"><div class="btn p" style="width:100%">📅 Inplannen</div></div>`;
  const boodschappen = `<div class="pagetitle" style="font-size:32px;margin-top:6px">Boodschappen</div><div class="sub">6 te gaan · ± € 22,40</div>
    ${shopping.map(([h, items]) => `<div class="k" style="margin:16px 2px 2px">${h.replace(/^\S+ /, '')}</div>${items.map(([, n, a, d]) => `<div class="row ${d ? 'done' : ''}" style="padding:11px 0;${line}"><span class="check ${d ? 'on' : ''}">${d ? '✓' : ''}</span><span class="grow n" style="font-size:15.5px">${n}</span><span class="small muted">${a}</span></div>`).join('')}`).join('')}
    <div style="position:absolute;left:18px;right:18px;bottom:96px;background:var(--ink);color:#fff;border-radius:99px;padding:13px 18px;font-weight:800" class="row"><span class="grow">2 afgevinkt</span><span style="color:var(--peach2)">Naar ‘Al in huis’ ›</span></div>`;
  return [phone('Planner', 'Planner', planner), phone('Recepten', 'Recepten', recepten), `<div><div class="label">Recept</div><div class="phone">${status}<div class="scroll" style="height:714px;padding:0">${recept}</div>${reBar}${tabbar('Recepten')}</div></div>`, phone('Boodschappen', 'Meer', boodschappen)];
}

// ================= C – Foto's & bubbels =================
function C() {
  const say = (mood, text) => `<div class="row" style="margin:4px 0 12px"><div style="width:62px;flex:none">${buddySvg({ mood })}</div><div class="bubble grow">${text}</div></div>`;
  const planner = `${say('blij', 'Vanavond butter chicken, mmm! 🐾 Zaterdag is je ontbijt nog leeg.')}
    <div class="row" style="gap:6px;margin-bottom:12px">${days.map(([d, n]) => `<div style="flex:1;text-align:center;padding:8px 0;border-radius:18px;${n === 24 ? 'background:var(--primary);color:#fff' : 'background:var(--surface)'};font-weight:800"><div style="font-size:11px;opacity:.8">${d}</div><div class="h" style="font-size:18px">${n}</div><div style="height:6px">${[20, 21, 22, 23, 25].includes(n) ? '<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--primary)"></span>' : ''}</div></div>`).join('')}</div>
    ${[['diner', 'Butter chicken met pandanrijst', 'butter-chicken-met-pandanrijst', '717 kcal · € 3,25']].map(([k, n, img, m]) => `<div style="position:relative;border-radius:26px;overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow)"><img class="ph" src="${R(img)}" style="width:100%;height:220px">
      <div style="position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(40,20,10,.75));color:#fff"><div class="k" style="color:#ffd3b8">${k}</div><div class="h" style="font-size:20px">${n}</div><div class="small" style="opacity:.9">${m}</div></div></div>`).join('')}
    <div class="row" style="gap:10px"><div class="card" style="flex:1;text-align:center;border:2px dashed var(--line);box-shadow:none;background:transparent;color:var(--ptext);font-weight:800">🥣<br>+ ontbijt</div><div class="card" style="flex:1;text-align:center;border:2px dashed var(--line);box-shadow:none;background:transparent;color:var(--ptext);font-weight:800">🥪<br>+ lunch</div></div>`;
  const recepten = `${say('hongerig', 'Wat eten we vandaag? Ik heb al een paar ideetjes!')}
    <div class="search">🔎 Zoek recept…</div>
    <div class="k" style="margin:14px 2px 8px">✨ Voor jou</div>
    <div class="row" style="gap:10px;overflow:hidden">${recipes.slice(0, 2).map(([img, n, min, kc]) => `<div style="flex:none;width:250px;position:relative;border-radius:24px;overflow:hidden"><img class="ph" src="${R(img)}" style="width:250px;height:170px"><div style="position:absolute;left:0;right:0;bottom:0;padding:30px 12px 10px;background:linear-gradient(transparent,rgba(40,20,10,.7));color:#fff"><div class="n">${n}</div><div class="small">${min} min · ${kc} kcal</div></div></div>`).join('')}</div>
    <div class="k" style="margin:14px 2px 8px">Alles</div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${recipes.slice(2).concat(recipes.slice(0, 2)).map(([img, n]) => `<div><img class="ph" src="${R(img)}" style="width:100%;height:96px;border-radius:20px"><div class="small ell" style="font-weight:800;margin-top:4px">${n}</div></div>`).join('')}</div>`;
  const recept = `<div style="position:relative"><img class="ph" src="${R('kip-kerrie-met-rijst')}" style="width:100%;height:250px;border-radius:0 0 34px 34px"><div style="position:absolute;right:16px;bottom:-34px;width:84px;height:84px;border-radius:50%;background:var(--peach3);border:4px solid var(--bg);display:grid;place-items:end center;padding-bottom:4px"><div style="width:62px">${buddySvg({ mood: 'blij' })}</div></div></div>
    <div style="padding:14px 18px"><div class="pagetitle" style="max-width:250px">Kip kerrie met rijst</div>
      <div class="bubble" style="margin:10px 0 12px">Lekker én gezond: veel eiwit en groente 🐾 super · 82</div>
      <div class="row" style="gap:8px">${[['677', 'kcal'], ['39g', 'eiwit'], ['35', 'min'], ['€3,13', 'p.p.']].map(([v, l]) => `<div class="card" style="flex:1;margin:0;padding:8px;text-align:center"><div class="h" style="font-size:17px">${v}</div><div class="small muted">${l}</div></div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${ings.map(([img, n, a]) => `<div class="card" style="margin:0;padding:8px;text-align:center"><img class="ph" src="${I(img)}" style="width:44px;height:44px;border-radius:50%;margin:0 auto 4px"><div class="small" style="font-weight:800">${n}</div><div class="small muted">${a}</div></div>`).join('')}</div></div>`;
  const reBar = `<div style="position:absolute;left:0;right:0;bottom:84px;padding:26px 14px 12px;background:linear-gradient(rgba(255,247,239,0),var(--bg) 40%)" class="row"><span class="btn" style="flex:1">👩‍🍳 Koken</span><span class="btn p" style="flex:1.3">📅 Inplannen</span></div>`;
  const boodschappen = `${say('trots', 'Nog 6 dingetjes! Samen zijn we zo klaar 🛒')}
    <div class="chips"><span class="chip on">Alles · 8</span><span class="chip">🥦 4</span><span class="chip">🍗 1</span><span class="chip">🍚 2</span><span class="chip">✓ Al in huis</span></div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${shopping.flatMap(([, items]) => items).map(([img, n, a, d]) => `<div class="card" style="margin:0;padding:10px;${d ? 'opacity:.55' : ''};position:relative"><img class="ph" src="${I(img)}" style="width:100%;height:70px;border-radius:14px"><div class="n" style="font-size:14px;margin-top:6px;${d ? 'text-decoration:line-through' : ''}">${n}</div><div class="small muted">${a}</div>
      <span class="check ${d ? 'on' : ''}" style="position:absolute;right:16px;top:16px;background:${d ? 'var(--green)' : '#fff'}">${d ? '✓' : ''}</span></div>`).join('')}</div>`;
  return [phone('Planner', 'Planner', planner), phone('Recepten', 'Recepten', recepten), `<div><div class="label">Recept</div><div class="phone">${status}<div class="scroll" style="height:714px;padding:0">${recept}</div>${reBar}${tabbar('Recepten')}</div></div>`, phone('Boodschappen', 'Meer', boodschappen)];
}

// ================= Computer: planner =================
function desk() {
  const nav = `<div class="dtop"><div class="brand">${buddySvg({ mood: 'rust' })}Maaltijden</div>${['🏠 Vandaag', '📅 Planner', '📖 Recepten', '🛒', '🔥', '🥕', '⚙️'].map((x, i) => `<span class="dnav ${i === 1 ? 'on' : ''}">${x}</span>`).join('')}<span class="dlog">📷 Eten loggen</span></div>`;
  const full = [
    ['ma 20', [['diner', 'Boerenkoolstamppot met rookworst', 'boerenkoolstamppot-met-rookworst']]],
    ['di 21', [['diner', 'Nasi goreng', 'nasi-goreng']]],
    ['wo 22', [['lunch', 'Griekse salade met feta', 'griekse-salade-met-feta'], ['diner', 'Kip kerrie met rijst', 'kip-kerrie-met-rijst']]],
    ['do 23', [['diner', 'Macaroni met gehakt en kaas', 'macaroni-met-gehakt-en-kaas']]],
    ['vr 24', [['diner', 'Butter chicken met pandanrijst', 'butter-chicken-met-pandanrijst']]],
    ['za 25', [['lunch', 'Tosti ham-kaas', 'tosti-ham-kaas'], ['diner', 'Pasta pesto met kip', 'pasta-pesto-met-kip-en-spinazie']]],
    ['zo 26', [['diner', 'Hollandse pannenkoeken', 'hollandse-pannenkoeken']]],
  ];
  let body;
  if (opt === 'a') {
    body = `<div class="row" style="justify-content:space-between;margin-bottom:16px"><div class="row"><span class="btn">‹</span><div><div class="pagetitle">Week 43</div><div class="sub" style="margin:0 2px">20 – 26 oktober</div></div><span class="btn">›</span></div>
      <div class="row">${[['€ 75,03', 'weekkosten'], ['673', 'kcal per dag'], ['9', 'maaltijden']].map(([v, l]) => `<div class="card" style="margin:0;padding:8px 18px;text-align:center"><div class="h" style="font-size:20px">${v}</div><div class="small muted">${l}</div></div>`).join('')}<span class="btn p">✨ Weekmenu met Claude</span><span class="btn">🛒 Boodschappen</span></div></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:12px">${full.map(([d, meals]) => `<div class="card" style="margin:0;padding:12px;min-height:600px;${d === 'vr 24' ? 'outline:3px solid var(--primary)' : ''}"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b class="h" style="font-size:16px">${d}</b>${d === 'vr 24' ? '<span class="chip on" style="padding:3px 9px;font-size:11px">vandaag</span>' : ''}</div>
        ${['ontbijt', 'lunch', 'diner'].map((m) => { const x = meals.find((y) => y[0] === m); return x ? `<div style="margin-bottom:10px"><img class="ph" src="${R(x[2])}" style="width:100%;height:96px;border-radius:16px"><div class="k" style="margin-top:6px">${m}</div><div class="n" style="font-size:13.5px;line-height:1.25">${x[1]}</div></div>` : `<div style="border:2px dashed var(--line);border-radius:16px;padding:12px;text-align:center;color:var(--muted);font-weight:800;margin-bottom:10px;font-size:13px">+ ${m}</div>`; }).join('')}</div>`).join('')}</div>`;
  } else if (opt === 'b') {
    body = `<div style="max-width:900px;margin:0 auto"><div class="row" style="justify-content:space-between"><div><div class="pagetitle" style="font-size:34px">Deze week</div><div class="sub">20 – 26 oktober · € 75,03 · gem. 673 kcal per dag</div></div><div class="row"><span class="btn">‹ ›</span><span class="btn">✨ Vul de week aan</span></div></div>
      ${full.map(([d, meals]) => `<div class="row" style="align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)"><div style="width:110px" class="k ${d === 'vr 24' ? '' : ''}"><span style="${d === 'vr 24' ? 'color:var(--ptext)' : ''}">${d}</span></div>
        <div class="grow row" style="gap:28px;flex-wrap:wrap">${meals.map(([k, n, img]) => `<div class="row"><img class="ph" src="${R(img)}" style="width:42px;height:42px;border-radius:50%"><div><div class="n" style="font-size:15px">${n}</div><div class="small muted">${k}</div></div></div>`).join('')}<span class="muted" style="font-weight:800">+</span></div></div>`).join('')}</div>`;
  } else {
    body = `<div class="row" style="gap:18px;align-items:flex-start"><div style="width:330px;flex:none"><div class="card">${buddySvg({ mood: 'blij' })}<div class="bubble" style="margin-top:8px">Deze week 9 maaltijden gepland. Zaterdag is je ontbijt nog leeg, zal ik iets voorstellen? 🐾</div><div class="btn p" style="width:100%;margin-top:10px">✨ Ja, stel iets voor</div></div></div>
      <div class="grow"><div class="row" style="gap:8px;margin-bottom:16px">${days.map(([d, n]) => `<div style="flex:1;text-align:center;padding:10px 0;border-radius:20px;${n === 24 ? 'background:var(--primary);color:#fff' : 'background:var(--surface);box-shadow:var(--shadow)'};font-weight:800"><div style="font-size:12px;opacity:.8">${d}</div><div class="h" style="font-size:22px">${n}</div></div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${[['ontbijt', null], ['lunch', null], ['diner', ['Butter chicken met pandanrijst', 'butter-chicken-met-pandanrijst']]].map(([m, x]) => x ? `<div style="position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)"><img class="ph" src="${R(x[1])}" style="width:100%;height:300px"><div style="position:absolute;left:0;right:0;bottom:0;padding:50px 18px 16px;background:linear-gradient(transparent,rgba(40,20,10,.75));color:#fff"><div class="k" style="color:#ffd3b8">${m}</div><div class="h" style="font-size:22px">${x[0]}</div><div class="small">717 kcal · € 3,25 p.p.</div></div></div>`
        : `<div style="border:2.5px dashed var(--line);border-radius:26px;height:300px;display:grid;place-items:center;color:var(--ptext);font-weight:800;font-size:18px;text-align:center">${m === 'ontbijt' ? '🥣' : '🥪'}<br>+ ${m}</div>`).join('')}</div>
      <div class="k" style="margin:20px 2px 8px">Rest van de week</div><div class="row" style="gap:10px">${full.filter(([d]) => d !== 'vr 24').map(([d, meals]) => `<div style="flex:1"><img class="ph" src="${R(meals.at(-1)[2])}" style="width:100%;height:90px;border-radius:18px"><div class="small" style="font-weight:800;margin-top:4px">${d}</div></div>`).join('')}</div></div></div>`;
  }
  return [`<div><div class="label">Planner op de computer</div><div class="desk"><div class="chrome"><i></i><i></i><i></i><span>maaltijden.thuis/#/planner</span></div>${nav}<div class="dbody">${body}</div></div></div>`];
}

boards.innerHTML = (view === 'desk' ? desk() : { a: A, b: B, c: C }[opt]()).join('');
</script>
</body>
</html>
