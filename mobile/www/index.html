<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f">
  <title>Maaltijden</title>
  <style>
    :root {
      --bg: #f7f5f0; --surface: #ffffff; --text: #1f2a24; --muted: #6b726d; --border: #e3ded2;
      --primary: #2f6b4f; --primary-ink: #ffffff; --danger: #c0392b; --accent: #e8a33d;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141816; --surface: #1d2320; --text: #e9ece9; --muted: #9aa39d; --border: #323a35; --primary: #5fb88a; --primary-ink: #0d1a13; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
      padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
    }
    main { width: min(420px, 100%); display: grid; gap: 1.2rem; }
    .logo { width: 72px; height: 72px; }
    h1 { margin: 0; font-size: 1.6rem; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: .92rem; }
    form { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem; display: grid; gap: .8rem; }
    label { font-weight: 600; }
    input { font: inherit; width: 100%; padding: .75rem .8rem; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }
    input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
    button { font: inherit; font-weight: 600; padding: .8rem; border-radius: 10px; border: 0; background: var(--primary); color: var(--primary-ink); }
    button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }
    button:disabled { opacity: .6; }
    .status { min-height: 1.5em; font-size: .92rem; }
    .status.error { color: var(--danger); }
    .tips { font-size: .88rem; color: var(--muted); padding-left: 1.1rem; margin: 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22" fill="#2f6b4f"/>
      <g transform="translate(10 10) scale(.8)">
        <path d="M22 48 h56 v18 a14 14 0 0 1 -14 14 h-28 a14 14 0 0 1 -14 -14 z" fill="#f7f5f0"/>
        <rect x="17" y="44" width="66" height="7" rx="3.5" fill="#f7f5f0"/>
        <rect x="9" y="55" width="12" height="6" rx="3" fill="#f7f5f0"/>
        <rect x="79" y="55" width="12" height="6" rx="3" fill="#f7f5f0"/>
        <g fill="none" stroke="#e8a33d" stroke-width="4.5" stroke-linecap="round">
          <path d="M38 36 c-5 -6 5 -9 0 -16"/><path d="M50 36 c-5 -6 5 -9 0 -16"/><path d="M62 36 c-5 -6 5 -9 0 -16"/>
        </g>
      </g>
    </svg>
    <div>
      <h1>Maaltijden</h1>
      <p class="muted" id="intro">Verbinden met je Maaltijden-server…</p>
    </div>

    <form id="form" hidden>
      <label for="url">Adres van je server</label>
      <input id="url" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false"
             placeholder="bijv. 192.168.1.20:3000 of maaltijden.mijndomein.nl" required>
      <p class="status" id="status" role="status"></p>
      <button id="connect" type="submit">Verbinden</button>
      <ul class="tips">
        <li>Thuis: het IP-adres van je server met poort 3000, bijv. <code>192.168.1.20:3000</code>.</li>
        <li>Onderweg: het adres waarmee je de app via internet bereikt (met https).</li>
      </ul>
    </form>

    <div id="offline" hidden>
      <p class="status error" id="offline-msg"></p>
      <div class="row">
        <button id="retry" type="button">Opnieuw proberen</button>
        <button id="change" type="button" class="ghost">Ander adres</button>
      </div>
    </div>
  </main>

  <script>
    // De app slaat het serveradres op en opent daarna je eigen Maaltijden-server.
    // Omdat de app de pagina's van je server toont, is hij na een serverupdate automatisch bijgewerkt.
    const KEY = 'maaltijden-server';
    const $ = (id) => document.getElementById(id);

    function load() { try { return localStorage.getItem(KEY); } catch { return null; } }
    function save(url) { try { localStorage.setItem(KEY, url); } catch { /* geen opslag */ } }

    function normalize(input) {
      let u = String(input || '').trim();
      if (!u) return null;
      if (!/^https?:\/\//i.test(u)) {
        // Lokale adressen (IP, .local, localhost) via http, de rest via https
        const host = u.split(/[/:]/)[0];
        const local = /^(\d{1,3}\.){3}\d{1,3}$/.test(host) || host.endsWith('.local') || host === 'localhost' || !host.includes('.');
        u = (local ? 'http://' : 'https://') + u;
      }
      try {
        const url = new URL(u);
        return url.origin + url.pathname.replace(/\/+$/, '');
      } catch {
        return null;
      }
    }

    async function check(url) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 7000);
      try {
        const res = await fetch(`${url}/health`, { signal: ctrl.signal, cache: 'no-store' });
        const data = await res.json();
        if (data.app !== 'maaltijden') throw new Error('Dit adres is geen Maaltijden-server.');
        return data;
      } catch (err) {
        if (err.name === 'AbortError') throw new Error('De server reageert niet. Staat hij aan en zit je op hetzelfde netwerk?');
        if (err instanceof SyntaxError) throw new Error('Dit adres is geen Maaltijden-server.');
        throw new Error(err.message.includes('server') ? err.message : 'Kan de server niet bereiken. Controleer het adres en je wifi.');
      } finally {
        clearTimeout(t);
      }
    }

    function open(url) {
      location.replace(`${url}/#/planner`);
    }

    function showForm(message = '', isError = false) {
      $('offline').hidden = true;
      $('form').hidden = false;
      $('intro').textContent = 'Vul het adres in van de server waarop Maaltijden draait.';
      $('url').value = load()?.replace(/^http:\/\//, '') || '';
      $('status').textContent = message;
      $('status').className = `status${isError ? ' error' : ''}`;
      $('url').focus();
    }

    function showOffline(url, message) {
      $('form').hidden = true;
      $('offline').hidden = false;
      $('intro').textContent = url;
      $('offline-msg').textContent = message;
    }

    async function start() {
      const saved = load();
      const change = new URLSearchParams(location.search).has('wijzig');
      if (!saved || change) return showForm();
      $('intro').textContent = `Verbinden met ${saved}…`;
      try {
        await check(saved);
        open(saved);
      } catch (err) {
        showOffline(saved, err.message);
      }
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = normalize($('url').value);
      if (!url) return showForm('Dit is geen geldig adres.', true);
      $('connect').disabled = true;
      $('status').className = 'status';
      $('status').textContent = 'Verbinding testen…';
      try {
        await check(url);
        save(url);
        $('status').textContent = 'Verbonden!';
        open(url);
      } catch (err) {
        $('status').className = 'status error';
        $('status').textContent = err.message;
      } finally {
        $('connect').disabled = false;
      }
    });
    $('retry').addEventListener('click', start);
    $('change').addEventListener('click', () => showForm());

    start();
  </script>
</body>
</html>
